application:
  subdomain: miaomiao-search
  oidc_redirect_path: /api/auth/oidc/callback
  public_path:
    - /mcp
    - /
    - /api/auth/*
  routes:
    - /=http://web:3000
  upstreams:
    - location: /api/
      backend: http://api:3001
      disable_trim_location: true
      use_backend_host: true
    - location: /mcp
      backend: http://api:3001
      disable_trim_location: true
      use_backend_host: true

services:
  web:
    image: registry.lazycat.cloud/u30387910/c1own123/lazycat:f22d61d82f52b1a5
    command: sh /opt/miaomiao-search/lzc/run-web.sh
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  api:
    image: registry.lazycat.cloud/u30387910/c1own123/lazycat:f22d61d82f52b1a5
    command: sh /opt/miaomiao-search/lzc/run-api.sh
    user: "0"
    binds:
      - /lzcapp/var/miaomiao-search/data:/lzcapp/var/miaomiao-search/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/lzcapp/var/miaomiao-search/data
      - SERVER_HOST=0.0.0.0
      - PORT=3001
      - OPEN_WEBSEARCH_URL=http://127.0.0.1:3210
      - PLAYWRIGHT_PACKAGE=playwright-core
      - PLAYWRIGHT_EXECUTABLE_PATH=/usr/bin/chromium
      - APP_ORIGIN=https://{{ .S.AppDomain }}
      - APP_INSTANCE_SECRET={{ stable_secret (printf "miaomiao-search:%s" .S.AppDomain) }}
      - OIDC_CLIENT_ID=${LAZYCAT_AUTH_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${LAZYCAT_AUTH_OIDC_CLIENT_SECRET}
      - OIDC_ISSUER_URI=${LAZYCAT_AUTH_OIDC_ISSUER_URI}
      - OIDC_AUTH_URI=${LAZYCAT_AUTH_OIDC_AUTH_URI}
      - OIDC_TOKEN_URI=${LAZYCAT_AUTH_OIDC_TOKEN_URI}
      - OIDC_USERINFO_URI=${LAZYCAT_AUTH_OIDC_USERINFO_URI}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://api:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
